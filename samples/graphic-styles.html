<style>
/* layout: full-bleed 3D stage; title lockup top-left, style rail + one action pinned bottom */
:root{
  --bg:#0e0b09;
  --ink:#fbf4e6;
  --muted:rgba(251,244,230,.72);
  --accent:#ffb84a;
  --panel:rgba(14,11,9,.58);
  --line:rgba(251,244,230,.22);
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;padding:16px 16px 40px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0))}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.game{font-size:13px;color:var(--accent);margin-top:2px;font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.4vw,54px);line-height:1.08;margin-top:8px;
  text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.55);max-width:14em}
.sub{font-size:14px;line-height:1.5;color:var(--muted);margin-top:6px;max-width:26em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:44px 16px 16px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}
.quote{font-family:var(--display);font-size:clamp(17px,4.6vw,24px);line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.7);max-width:22em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--panel)}
.row{display:flex;gap:8px;align-items:stretch;pointer-events:auto}
.rail{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;font:600 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:12px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rail button i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.rail button[aria-pressed="true"]{background:var(--accent);color:#17110a;border-color:var(--accent)}
.rail button[aria-pressed="true"] i{color:#17110a}
#atk{flex:0 0 auto;font:600 13px/1 var(--body);color:var(--ink);background:transparent;border:1.5px solid var(--accent);
  border-radius:4px;padding:12px 14px;cursor:pointer}
#atk:active{background:var(--accent);color:#17110a}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-size:11px;color:var(--muted)}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;line-height:1.6}
@media (min-width:800px){.top{padding:28px 32px 60px}.bottom{padding:60px 32px 24px}}
</style>

<body>
<canvas id="stage" aria-label="쥐 가장과 고양이 보스가 있는 3D 장면. 끌어서 시점을 돌립니다."></canvas>
<div class="top">
  <div class="eyebrow" id="eyebrow">그래픽 스타일 샘플 1 / 5</div>

<script>
(function(){

const T=window.THREE;
const canvas=document.getElementById('stage');
if(!T){document.getElementById('err').style.display='grid';return;}

/* ───────── style definitions ───────── */
const STY={
 clay:{n:'클레이 스톱모션',font:'"Jua"',accent:'#ffb84a',
  sub:'손자국이 남은 점토 인형을 한 프레임씩 찍은 인형극. 초당 12프레임으로 끊어 움직입니다.',
  quote:'“오늘 저녁도, 살아서 돌아간다.”',tags:['12fps 끊어 찍기','텅스텐 조명','미니어처 심도'],
  bg:0x1b130d,fog:[0x1b130d,16,46],fur:0x8a6a52,belly:0xe2cdb0,pink:0xe8a092,cape:0xc4452d,metal:0xbfc3c9,cap:0x3d79ad,
  wall:['#5f8a80','#557c73'],base:0xe9dcc4,floor:['#a9743f','#9c6a39','#b27d47'],fline:'#5a3a1c',

 cel:{n:'셀 애니메이션',font:'"Black Han Sans"',accent:'#ffd84a',
  sub:'굵은 먹선과 3단 명암. 한낮의 부엌을 가로지르는 모험 활극에 가장 익숙한 그림입니다.',
  quote:'“아빠는 금방 다녀올게.”',tags:['외곽선','3단 툰 명암','선명한 원색'],
  bg:0x9fd4ff,fog:[0xbfe6ff,22,60],fur:0xb98a5e,belly:0xfff0d6,pink:0xff9f9a,cape:0xe23d2e,metal:0xe6eef5,cap:0x2f6fd0,
  wall:['#7ec8c2','#6fbab4'],base:0xfff6e2,floor:['#e0a35c','#d39650','#ebb06b'],fline:'#8a5a2b',
  cat:0xf08a2e,catB:0xfff1dc,eye:0xfff27a,slip:0xff6f91,pants:0x4767c9,wood:0xe2b877,cheese:0xffd23a,
  gobo:[0xfff3b0,.42,'pane'],dust:[0xffffff,.06,.7],
  post:{mode:1,sat:1.2,con:1.05,vig:.15,grain:0,bloom:0,tint:[1,1,1]},fps:0},
 noir:{n:'느와르 그래픽노블',font:'"Song Myung"',accent:'#ffb020',
  sub:'흑백 망점 위에 색은 둘뿐입니다. 집의 호박색 불빛, 그리고 아버지의 붉은 망토.',
  quote:'“이 집의 불빛은, 내가 지킨다.”',tags:['흑백 망점','블라인드 그림자','포인트 컬러'],
  bg:0x050505,fog:[0x050505,14,40],fur:0x858585,belly:0xb8b8b8,pink:0x9a9a9a,cape:0xc01818,metal:0xf4f4f4,cap:0x7a7a7a,
  wall:['#3a3a3e','#313135'],base:0x8a8a8a,floor:['#4a4a4e','#444448','#505054'],fline:'#1a1a1c',
  cat:0x161618,catB:0x2a2a2c,eye:0xffb020,slip:0x5a5a5a,pants:0x202022,wood:0x8c8c8c,cheese:0xffb020,
  gobo:[0xffffff,.5,'blind'],dust:[0xffffff,.04,.35],
  post:{mode:2,sat:1,con:1.12,vig:.6,grain:.07,bloom:0,tint:[1,1,1]},fps:0},
 dark:{n:'시네마틱 다크 판타지',font:'"Gowun Batang"',accent:'#ff9a3c',
  sub:'달빛과 금속, 떠다니는 먼지. 부엌 바닥이 보스전의 전장이 되는 사실적인 조명입니다.',
  quote:'“물러설 곳은 없다. 등 뒤가 집이니까.”',tags:['PBR 금속','빛줄기와 블룸','청록·주황 색보정'],
  bg:0x05070c,fog:[0x070a12,10,36],fur:0x6b5a4e,belly:0xa89a88,pink:0xb5847c,cape:0x7a1e1e,metal:0xcfd6e0,cap:0x9a7440,
  wall:['#232a36','#1e2530'],base:0x3a3530,floor:['#3b2e24','#35291f','#42342a'],fline:'#120d09',
  cat:0x2a2e3a,catB:0x3c4250,eye:0x7dff6a,slip:0x3a2630,pants:0x1b2030,wood:0x5a4632,cheese:0xd9a520,
  gobo:[0x8fb2ff,.42,'pane'],dust:[0xbfd4ff,.045,.6],
  post:{mode:3,sat:1.05,con:1.12,vig:.7,grain:.04,bloom:1,tint:[.97,1,1.06]},fps:0},
 paper:{n:'페이퍼크래프트 팝업북',font:'"Gaegu"',accent:'#ff7a4a',
  sub:'접은 종이로 세운 그림책 무대. 종이 결과 접힌 모서리가 그대로 보입니다.',
  quote:'“옛날 옛적, 벽 속에 작은 기사가 살았습니다.”',tags:['접은 종이 면','종이 결 질감','팝업 무대'],
  bg:0xf3ead8,fog:[0xf3ead8,24,70],fur:0xa9917a,belly:0xf4ead8,pink:0xf2a7a0,cape:0xe4573d,metal:0xdfe5ea,cap:0x4a8fc4,
  wall:['#b9d3c6','#aac7b9'],base:0xfbf5e6,floor:['#e3c79a','#dbbd8d','#ebd1a8'],fline:'#b89868',
  cat:0x7c6bb0,catB:0xe9e2f6,eye:0xffe066,slip:0xf08a6a,pants:0x5b7fb8,wood:0xd9b98a,cheese:0xffd24a,
  gobo:[0xffffff,.25,'pane'],dust:[0xffffff,.05,.0],
  post:{mode:4,sat:.95,con:1,vig:.2,grain:.02,bloom:0,tint:[1,1,1]},fps:0}
};
const ORDER=['clay','cel','noir','dark','paper'];

/* ───────── renderer ───────── */
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}
catch(e){document.getElementById('err').style.display='grid';return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const mobile=Math.min(innerWidth,innerHeight)<700;
const DPR=Math.min(window.devicePixelRatio||1,mobile?1.5:2);
renderer.setPixelRatio(DPR);
const camera=new T.PerspectiveCamera(45,1,.5,120);
let rt=null;

/* ───────── canvas textures ───────── */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rx,ry){const t=new T.CanvasTexture(c);if(rx){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);}t.anisotropy=4;return t;}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function plankTex(S){const c=cv(512,512),g=c.getContext('2d'),r=rnd(7);
  for(let i=0;i<8;i++){g.fillStyle=S.floor[i%3];g.fillRect(0,i*64,512,64);
    g.globalAlpha=.08;for(let j=0;j<40;j++){g.fillStyle=r()>.5?'#000':'#fff';g.fillRect(r()*512,i*64+r()*64,60+r()*160,1);}g.globalAlpha=1;
    g.fillStyle=S.fline;g.fillRect(0,i*64,512,3);const x=(i*173)%512;g.fillRect(x,i*64,3,64);}
  return tex(c,6,6);}
function wallTex(S){const c=cv(256,256),g=c.getContext('2d');g.fillStyle=S.wall[0];g.fillRect(0,0,256,256);
  g.fillStyle=S.wall[1];for(let i=0;i<4;i++)g.fillRect(i*64,0,26,256);
  g.globalAlpha=.5;for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.beginPath();g.arc(x*64+45,y*64+32,5,0,7);g.fill();}g.globalAlpha=1;
  return tex(c,10,6);}
function holeTex(id){const c=cv(256,272),g=c.getContext('2d');
  const gr=g.createRadialGradient(128,170,10,128,150,190);gr.addColorStop(0,'#fff0b8');gr.addColorStop(.35,'#ffc45a');gr.addColorStop(.75,'#c8601c');gr.addColorStop(1,'#3a1406');
  g.fillStyle=gr;g.fillRect(0,0,256,272);
  g.fillStyle='rgba(60,22,6,.9)';
  g.fillRect(0,232,256,40);                       /* floor */
  g.fillRect(150,186,74,8);g.fillRect(158,194,6,40);g.fillRect(210,194,6,40); /* table */
  g.fillRect(22,206,84,10);g.fillRect(22,186,10,48);g.fillRect(98,200,8,34);  /* bed */
  g.beginPath();g.ellipse(52,204,20,9,0,0,7);g.fill();
  g.fillRect(183,170,6,16);                        /* candle */
  g.fillStyle='#fff7d0';g.beginPath();g.ellipse(186,162,5,9,0,0,7);g.fill();
  g.strokeStyle='rgba(60,22,6,.9)';g.lineWidth=5;g.strokeRect(96,70,64,56);g.beginPath();g.moveTo(128,70);g.lineTo(128,126);g.moveTo(96,98);g.lineTo(160,98);g.stroke();
  return tex(c);}
function goboTex(kind){const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,256);
  g.fillStyle='#fff';g.shadowColor='#fff';g.shadowBlur=10;
  if(kind==='blind'){for(let i=0;i<9;i++)g.fillRect(34,30+i*22,188,10);}
  else{g.fillRect(40,34,82,88);g.fillRect(134,34,82,88);g.fillRect(40,134,82,88);g.fillRect(134,134,82,88);}
  g.shadowBlur=0;const gr=g.createRadialGradient(128,128,60,128,128,150);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);return tex(c);}
function noiseTex(n,lo,hi,blotch){const c=cv(n,n),g=c.getContext('2d'),r=rnd(11);const d=g.createImageData(n,n);
  for(let i=0;i<n*n;i++){const v=lo+(hi-lo)*r();d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255;}g.putImageData(d,0,0);
  if(blotch){g.globalAlpha=.25;for(let i=0;i<60;i++){g.strokeStyle=r()>.5?'#fff':'#666';g.lineWidth=1+r()*2;g.beginPath();g.ellipse(r()*n,r()*n,6+r()*14,3+r()*8,r()*3,0,7);g.stroke();}}
  return tex(c,2,2);}
function shaftTex(){const c=cv(64,256),g=c.getContext('2d');const a=g.createLinearGradient(0,0,64,0);
  a.addColorStop(0,'#000');a.addColorStop(.5,'#fff');a.addColorStop(1,'#000');g.fillStyle=a;g.fillRect(0,0,64,256);
  const b=g.createLinearGradient(0,0,0,256);b.addColorStop(0,'rgba(0,0,0,.2)');b.addColorStop(1,'rgba(0,0,0,1)');g.fillStyle=b;g.fillRect(0,0,64,256);return tex(c);}
function gradTex(arr){const d=new Uint8Array(arr.length*4);arr.forEach((v,i)=>{d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;});
  const t=new T.DataTexture(d,arr.length,1,T.RGBAFormat);t.minFilter=t.magFilter=T.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;}
const grad3=gradTex([95,175,255]),grad2=gradTex([45,255]);
const fingerTex=noiseTex(128,90,170,true),paperTex=noiseTex(128,205,255,false);
let envTex=null;
function getEnv(){if(envTex)return envTex;const pm=new T.PMREMGenerator(renderer),es=new T.Scene();es.background=new T.Color(0x0a0f1c);
  const a=new T.Mesh(new T.SphereGeometry(3,16,12),new T.MeshBasicMaterial({color:0xff8a2a}));a.position.set(-6,1,-7);es.add(a);
  const b=new T.Mesh(new T.BoxGeometry(6,6,.2),new T.MeshBasicMaterial({color:0xaac8ff}));b.position.set(7,8,3);b.lookAt(0,0,0);es.add(b);
  const c=new T.Mesh(new T.BoxGeometry(30,.2,30),new T.MeshBasicMaterial({color:0x2a2018}));c.position.y=-4;es.add(c);
  envTex=pm.fromScene(es,.04).texture;pm.dispose();return envTex;}

/* ───────── per-style building kit ───────── */
function weld(geo){const p=geo.attributes.position,n=geo.attributes.normal,m={};
  for(let i=0;i<p.count;i++){const k=Math.round(p.getX(i)*1e3)+'_'+Math.round(p.getY(i)*1e3)+'_'+Math.round(p.getZ(i)*1e3);(m[k]=m[k]||[]).push(i);}
  for(const k in m){const a=m[k];if(a.length<2)continue;let x=0,y=0,z=0;a.forEach(i=>{x+=n.getX(i);y+=n.getY(i);z+=n.getZ(i);});
    const l=Math.hypot(x,y,z)||1;a.forEach(i=>n.setXYZ(i,x/l,y/l,z/l));}}
function lump(geo){geo.computeBoundingSphere();const R=geo.boundingSphere.radius||1,c=geo.boundingSphere.center,p=geo.attributes.position,f=2.6/R,a=R*.04;
  for(let i=0;i<p.count;i++){let x=p.getX(i)-c.x,y=p.getY(i)-c.y,z=p.getZ(i)-c.z;const l=Math.hypot(x,y,z)||1,X=x*f,Y=y*f,Z=z*f;
    const d=(Math.sin(X*1.7+1.3)*Math.sin(Y*1.9+2.1)*Math.sin(Z*1.5+.7)+.5*Math.sin(X*3.9+Y*3.1)*Math.sin(Z*4.3+Y*2.7))*a;
    p.setXYZ(i,c.x+x+x/l*d,c.y+y+y/l*d,c.z+z+z/l*d);}
  geo.computeVertexNormals();weld(geo);}
function outlineMat(th){return new T.ShaderMaterial({side:T.BackSide,uniforms:{th:{value:th}},
  vertexShader:'uniform float th;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vec3 n=normalize(normalMatrix*normal);mv.xyz+=n*th;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'void main(){gl_FragColor=vec4(.09,.06,.05,1.);}'});}

function kit(id,S){
  const seg=id==='paper'?7:28;
  const edgeMat=new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.55});
  const lines={};
  function M(c,o){o=o||{};
    if(o.glow)return new T.MeshBasicMaterial({color:c,fog:false});
    switch(id){
      case 'clay':return new T.MeshStandardMaterial({color:c,roughness:o.metal?.45:.9,metalness:o.metal?.3:0,bumpMap:fingerTex,bumpScale:.012,side:o.ds?T.DoubleSide:T.FrontSide});
      case 'cel':return new T.MeshToonMaterial({color:c,gradientMap:grad3,side:o.ds?T.DoubleSide:T.FrontSide});
      case 'noir':{let col=new T.Color(c);if(!o.accent){const l=col.r*.3+col.g*.59+col.b*.11;col=new T.Color(l,l,l);}
        return new T.MeshToonMaterial({color:col,gradientMap:grad2,side:o.ds?T.DoubleSide:T.FrontSide});}
      case 'dark':return new T.MeshStandardMaterial({color:c,roughness:o.metal?.26:.82,metalness:o.metal?1:0,envMap:getEnv(),envMapIntensity:o.metal?1.4:.35,side:o.ds?T.DoubleSide:T.FrontSide});
      default:return new T.MeshStandardMaterial({color:c,roughness:1,metalness:0,flatShading:true,map:paperTex,side:o.ds?T.DoubleSide:T.FrontSide});
    }}
  function mesh(geo,mat,o){o=o||{};
    if(id==='clay'&&!o.noLump)lump(geo);
    const m=new T.Mesh(geo,mat);m.castShadow=!o.noShadow;m.receiveShadow=true;
    if(id==='cel'&&!o.noLine){const th=o.line||.022;m.add(new T.Mesh(geo,lines[th]||(lines[th]=outlineMat(th))));}

/* ───────── scene ───────── */
function build(id){
  const S=STY[id],K=kit(id,S),scene=new T.Scene();
  scene.background=new T.Color(S.bg);scene.fog=new T.Fog(S.fog[0],S.fog[1],S.fog[2]);
  /* lights */

  key.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);key.shadow.bias=-.0004;key.shadow.normalBias=.04;
  const holeL=new T.PointLight(0xffa040,1,11,2);holeL.position.set(-3.2,1,-5.8);scene.add(holeL);
  if(id==='clay'){scene.add(new T.HemisphereLight(0xffe2b8,0x3a2a20,.55));key.color.set(0xffc98a);key.intensity=1.05;key.position.set(6,11,7);
    const f=new T.DirectionalLight(0x6f8fb0,.28);f.position.set(-8,5,3);scene.add(f);holeL.intensity=1.3;}
  if(id==='cel'){scene.add(new T.HemisphereLight(0xdff1ff,0x8a7458,.78));key.color.set(0xfff2cc);key.intensity=.95;key.position.set(5,12,6);holeL.intensity=.7;}
  if(id==='noir'){scene.add(new T.AmbientLight(0xffffff,.1));key.intensity=1.1;key.position.set(9,9,3);
    const r=new T.DirectionalLight(0xffffff,.8);r.position.set(-7,8,-3);scene.add(r);holeL.intensity=1.8;holeL.color.set(0xffb020);}
  if(id==='dark'){scene.add(new T.HemisphereLight(0x3a4c70,0x14100c,.62));const wf=new T.PointLight(0xffb070,1.1,9,2);wf.position.set(-2.6,2.2,3.6);scene.add(wf);key.color.set(0x8fb2ff);key.intensity=1.25;key.position.set(7,12,1);
    holeL.intensity=2.4;holeL.color.set(0xff8a2a);holeL.distance=13;
    const e=new T.PointLight(0x7dff6a,.6,7,2);e.position.set(1.6,4.2,-1.2);scene.add(e);}
  if(id==='paper'){scene.add(new T.HemisphereLight(0xffffff,0xd2c2a4,.82));key.color.set(0xfff6e0);key.intensity=.62;key.position.set(4,11,8);holeL.intensity=.6;}
  scene.add(key);

  /* room */
  const fm=K.M(0xffffff);fm.map=plankTex(S);if(id==='noir'||id==='cel')fm.color.set(0xffffff);
  const floor=new T.Mesh(new T.PlaneGeometry(60,60),fm);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  const wm=K.M(0xffffff);wm.map=wallTex(S);
  const wall=new T.Mesh(new T.PlaneGeometry(60,30),wm);wall.position.set(0,15,-7);wall.receiveShadow=true;scene.add(wall);
  scene.add(at(K.box(60,1.1,.16,S.base,{noLine:true}),0,.55,-6.92));
  scene.add(at(K.box(60,.12,.22,S.base,{noLine:true}),0,1.14,-6.9));
  /* mouse hole: painted home interior + family at the door */
  const w=1.7,hh=1.85,a=new T.Shape();a.moveTo(-w/2,0);a.lineTo(-w/2,hh-w/2);a.absarc(0,hh-w/2,w/2,Math.PI,0,true);a.lineTo(w/2,0);
  const ag=new T.ShapeGeometry(a,24),uv=ag.attributes.uv,pp=ag.attributes.position;
  for(let i=0;i<uv.count;i++)uv.setXY(i,(pp.getX(i)+w/2)/w,pp.getY(i)/hh);
  const hole=new T.Mesh(ag,new T.MeshBasicMaterial({map:holeTex(id),fog:false}));hole.position.set(-3.2,0,-6.72);scene.add(hole);
  const frame=new T.Mesh(new T.ShapeGeometry(a,24),new T.MeshBasicMaterial({color:id==='paper'?0x8a6a4a:0x140a05}));frame.position.set(-3.2,0,-6.78);frame.scale.set(1.13,1.07,1);scene.add(frame);
  const fam=[at(buildMini(K,.82,id==='noir'?0x999999:0x6f9ad0),-3.55,0,-6.25),at(buildMini(K,.46),-2.95,0,-6.05),at(buildMini(K,.4),-3.2,0,-5.85)];
  fam[0].rotation.y=.5;fam[1].rotation.y=.3;fam[2].rotation.y=.45;fam.forEach(m=>scene.add(m));
  /* light patch from the window */
  const gb=new T.Mesh(new T.PlaneGeometry(8,11),new T.MeshBasicMaterial({map:goboTex(S.gobo[2]),color:S.gobo[0],transparent:true,opacity:S.gobo[1],blending:T.AdditiveBlending,depthWrite:false,fog:false}));
  gb.rotation.x=-Math.PI/2;gb.rotation.z=.4;gb.position.set(-.3,.02,.2);scene.add(gb);
  /* props */
  scene.add(at(K.box(.9,22,.9,S.wood,{line:.03}),4.6,11,-5.9));
  scene.add(at(K.box(.9,22,.9,S.wood,{line:.03}),9.5,11,-2.5));
  const trap=buildTrap(K);trap.position.set(2.15,0,2.5);trap.rotation.y=-.55;trap.scale.setScalar(1.15);scene.add(trap);
  const crumb=K.sph(.14,S.cheese,{accent:true});at(crumb,-1.3,.1,1.9,1.2,.7,1);scene.add(crumb);
  const human=buildHuman(K);human.position.set(-5.5,0,-2.6);human.rotation.y=.35;scene.add(human);
  const cat=buildCat(K);cat.g.position.set(2.3,0,-3.9);cat.g.rotation.y=-.42;cat.g.scale.setScalar(3.2);scene.add(cat.g);
  const hero=buildHero(K);hero.g.position.set(-.35,0,1.6);hero.g.rotation.y=.42;hero.g.scale.setScalar(1.5);scene.add(hero.g);

  /* style-only extras */
  let shafts=[];
  if(id==='dark'){const st=shaftTex();for(let i=0;i<3;i++){const m=new T.Mesh(new T.PlaneGeometry(3.2,20),new T.MeshBasicMaterial({map:st,color:0x9fbcff,transparent:true,opacity:.1,blending:T.AdditiveBlending,depthWrite:false,fog:false,side:T.DoubleSide}));
      m.position.set(2.2+i*1.5,8.6,-.6+i*.5);m.rotation.z=.55;scene.add(m);shafts.push(m);}}
  if(id==='paper'){
    const wh=new T.MeshStandardMaterial({color:0xfffaf0,roughness:1,map:paperTex});
    [[hero.g.position,1.25],[cat.g.position,3.4],[trap.position,1.5]].forEach(q=>{const d=new T.Mesh(new T.CircleGeometry(q[1],7),wh);d.rotation.x=-Math.PI/2;d.position.set(q[0].x,.012,q[0].z);d.receiveShadow=true;scene.add(d);});
    const thr=new T.LineBasicMaterial({color:0x8a7a66});
    const hang=(geo,col,x,y,z)=>{const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:col,roughness:1,map:paperTex,side:T.DoubleSide}));m.position.set(x,y,z);m.castShadow=true;scene.add(m);
      const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute([x,y,z,x,30,z],3));scene.add(new T.Line(lg,thr));return m;};
    const star=new T.Shape();for(let i=0;i<10;i++){const r=i%2?.2:.48,an=i*Math.PI/5+Math.PI/2;star[i?'lineTo':'moveTo'](Math.cos(an)*r,Math.sin(an)*r);}
    shafts=[hang(new T.CircleGeometry(1.1,9),0xffe08a,-1.6,9.2,-4.5),hang(new T.ShapeGeometry(star),0xfff3c0,1.2,10.4,-3),hang(new T.ShapeGeometry(star),0xfff3c0,-3.8,7.6,-3.4),hang(new T.ShapeGeometry(star),0xfff3c0,3.6,8.2,-5)];
  }
  /* dust */
  let dust=null;
  if(S.dust[2]>0){const n=180,p=new Float32Array(n*3),r=rnd(3);for(let i=0;i<n;i++){p[i*3]=(r()-.5)*16;p[i*3+1]=r()*10;p[i*3+2]=(r()-.5)*12-1;}
    const dg=new T.BufferGeometry();dg.setAttribute('position',new T.BufferAttribute(p,3));
    dust=new T.Points(dg,new T.PointsMaterial({color:S.dust[0],size:S.dust[1],transparent:true,opacity:S.dust[2],blending:T.AdditiveBlending,depthWrite:false,fog:false}));scene.add(dust);}

  function tick(time){
    const t=S.fps?Math.floor(time*S.fps)/S.fps:time;
    /* hero */
    const H=hero;H.body.scale.y=1.15*(1+Math.sin(t*2.2)*.02);
    H.head.rotation.y=Math.sin(t*.5)*.35-.1;H.head.rotation.x=Math.sin(t*.8)*.05-.05;
    H.ears[0].rotation.z=Math.max(0,Math.sin(t*3.1+1))**8*.4;H.ears[1].rotation.z=-(Math.max(0,Math.sin(t*2.3))**8)*.4;
    H.tail.rotation.y=Math.sin(t*1.4)*.25;
    const ca=H.cape.geometry.attributes.position,cb=H.capeBase;
    for(let i=0;i<ca.count;i++){const x=cb[i*3],y=cb[i*3+1],v=.5-y;
      ca.setXYZ(i,x*(.75+v*.6),-v*H.capeLen+.0,-(.02+v*.42)-Math.sin(t*2.4+v*4.5+x*2.5)*.07*v-Math.abs(x)*.25*(1-v));}
    ca.needsUpdate=true;H.cape.geometry.computeVertexNormals();
    let ax=-.55,az=-.3,sx=Math.PI/2-1.05,ly=0;
    if(H.atk>=0){const p=(time-H.atk)/.55;
      if(p>=1){H.atk=-1;H.slash.material.opacity=0;}
      else{if(p<.3){ax=-.55+(-2.2)*(p/.3);}else if(p<.55){const q=(p-.3)/.25;ax=-2.75+3.3*q;ly=q*.18;}else{const q=(p-.55)/.45;ax=.55-1.1*q;ly=.18*(1-q);}
        sx=Math.PI/2-.4;H.slash.material.opacity=p>.28&&p<.75?(1-Math.abs((p-.5)/.25))*.85:0;}}
    H.armR.rotation.set(ax,0,az);H.sword.rotation.x=sx;
    H.armL.rotation.set(-1.0+Math.sin(t*2.2)*.03,-.15,.3);H.shield.rotation.x=1.0;
    H.g.position.z=1.6+ly;
    /* family */
    fam.forEach((m,i)=>{m.position.y=Math.abs(Math.sin(t*2+i*1.7))*.04*(i?1:.4);m.userData.head.rotation.y=Math.sin(t*.9+i)*.25;});
    /* cat boss */
    cat.body.scale.y=.88*(1+Math.sin(t*1.3)*.025);
    cat.head.rotation.y=Math.sin(t*.4)*.18;cat.head.rotation.z=Math.sin(t*.27)*.06;cat.head.position.y=1.28+Math.sin(t*1.3)*.02;
    cat.tail.forEach((j,i)=>{j.rotation.y=(i?.26:-.3)+Math.sin(t*1.6-i*.5)*.2;j.rotation.x=i>5?-.22:0;});
    /* human foot */
    const st=Math.max(0,Math.sin(t*.55));human.position.y=st*st*1.6;human.rotation.x=-st*.12;
    if(dust){dust.rotation.y=time*.02;dust.position.y=Math.sin(time*.2)*.4;}
    if(id==='dark')shafts.forEach((m,i)=>m.material.opacity=.085+Math.sin(time*.5+i)*.025);
    if(id==='paper')shafts.forEach((m,i)=>{m.rotation.y=Math.sin(time*.7+i*1.3)*.22;});
    crumb.rotation.y=t*.3;
  }
  return {scene,tick,hero,S};
}

/* ───────── post pass ───────── */
const postScene=new T.Scene(),postCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
const postMat=new T.ShaderMaterial({depthTest:false,depthWrite:false,
  uniforms:{tD:{value:null},res:{value:new T.Vector2(1,1)},time:{value:0},mode:{value:0},sat:{value:1},con:{value:1},vig:{value:0},grain:{value:0},bloom:{value:0},tint:{value:new T.Vector3(1,1,1)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`precision highp float;
uniform sampler2D tD;uniform vec2 res;uniform float time;uniform int mode;uniform float sat,con,vig,grain,bloom;uniform vec3 tint;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
void main(){
  vec2 uv=vUv;float asp=res.x/res.y;vec3 c=texture2D(tD,uv).rgb;
  if(mode==0){float r=pow(abs(uv.y-.5)*2.,2.4)*.011;vec3 a=c;
    for(int i=0;i<8;i++){float an=float(i)*.7854;a+=texture2D(tD,uv+vec2(cos(an),sin(an)*asp)*r).rgb;}c=a/9.;}
  if(bloom>0.){vec3 b=vec3(0.);
    for(int i=0;i<20;i++){float fi=float(i),an=fi*2.39996,rr=sqrt((fi+.5)/20.)*.032;b+=max(texture2D(tD,uv+vec2(cos(an),sin(an)*asp)*rr).rgb-.6,0.);}
    c+=b/20.*3.2*bloom;}
  float l=dot(c,vec3(.299,.587,.114));
  if(mode==2){
    float warm=smoothstep(.1,.36,c.r-c.b);
    float g=pow(smoothstep(.02,.72,l),.85);
    vec2 p=uv*res/max(3.,res.y/240.);p=vec2(p.x+p.y,p.x-p.y)*.7071;
    float d=length(fract(p)-.5);float dots=smoothstep(0.,.1,d-(1.-g)*.6);
    float tone=g*mix(1.,dots,.6*(1.-g));
    c=mix(vec3(tone)*vec3(.94,.96,1.),c*1.25,warm);}
  if(mode==4){float f=vn(uv*res/3.)*.5+vn(uv*res/11.)*.5;c*=.9+.16*f;c*=.97+.05*vn(vec2(uv.x*res.x/40.,uv.y*res.y/1.5));}
  c=(c-.5)*con+.5;l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,sat)*tint;
  float v=smoothstep(.98,.28,length((uv-.5)*vec2(1.,1.12)));c*=mix(1.,v,vig);
  c+=(h(uv*res+fract(time)*61.)-.5)*grain;
  gl_FragColor=vec4(clamp(c,0.,1.),1.);}`});
postScene.add(new T.Mesh(new T.PlaneGeometry(2,2),postMat));

/* ───────── view, input, loop ───────── */
const worlds={};let cur=null,curId='';
const orbit={yaw:0,pitch:.2,ty:0,tp:.2,last:-9};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?62:40;camera.updateProjectionMatrix();
  if(rt)rt.dispose();const W=Math.floor(w*DPR),H=Math.floor(h*DPR),opt={minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat};
  rt=renderer.capabilities.isWebGL2&&T.WebGLMultisampleRenderTarget?new T.WebGLMultisampleRenderTarget(W,H,opt):new T.WebGLRenderTarget(W,H,opt);
  postMat.uniforms.tD.value=rt.texture;postMat.uniforms.res.value.set(W,H);}
window.addEventListener('resize',resize);
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;orbit.ty=Math.max(-.8,Math.min(.8,orbit.ty-(e.clientX-drag.x)*.006));
  orbit.tp=Math.max(.04,Math.min(.62,orbit.tp+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY};orbit.last=performance.now()/1000;});
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>{drag=null;}));

const $=i=>document.getElementById(i),rail=$('rail');
ORDER.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.id='s-'+id;b.innerHTML='<i>'+(i+1)+'</i>'+STY[id].n;b.addEventListener('click',()=>select(id,true));rail.appendChild(b);});
function select(id,setHash){if(!STY[id])id='clay';curId=id;const S=STY[id];
  if(!worlds[id])worlds[id]=build(id);cur=worlds[id];
  const p=S.post,u=postMat.uniforms;u.mode.value=p.mode;u.sat.value=p.sat;u.con.value=p.con;u.vig.value=p.vig;u.grain.value=p.grain;u.bloom.value=p.bloom;u.tint.value.set(p.tint[0],p.tint[1],p.tint[2]);
  const rs=document.documentElement.style;rs.setProperty('--display',S.font+',"IBM Plex Sans KR",system-ui,sans-serif');rs.setProperty('--accent',S.accent);
  $('eyebrow').textContent='그래픽 스타일 샘플 '+(ORDER.indexOf(id)+1)+' / 5';$('name').textContent=S.n;$('sub').textContent=S.sub;$('quote').textContent=S.quote;
  $('tags').innerHTML=S.tags.map(t=>'<span>'+t+'</span>').join('');
  ORDER.forEach(k=>$('s-'+k).setAttribute('aria-pressed',k===id?'true':'false'));
  const b=$('s-'+id);if(b.scrollIntoView)try{b.scrollIntoView({block:'nearest',inline:'center'});}catch(_){}
  if(setHash){try{location.hash=id;}catch(_){}}}
$('atk').addEventListener('click',()=>{if(cur&&cur.hero.atk<0)cur.hero.atk=performance.now()/1000;});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('atk').click();}
  const n=parseInt(e.key,10);if(n>=1&&n<=5)select(ORDER[n-1],true);});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(STY[id]&&id!==curId)select(id,false);});

const tgt=new T.Vector3();
function frame(ms){const time=ms/1000;
  if(cur){cur.tick(time);
    const idle=time-orbit.last>4&&!reduce;const sway=idle?Math.sin(time*.16)*.28:0;
    orbit.yaw+=((orbit.ty+sway)-orbit.yaw)*.08;orbit.pitch+=(orbit.tp-orbit.pitch)*.08;
    const portrait=camera.aspect<1,dist=portrait?11.5:11.5;tgt.set(portrait?-.5:0,portrait?2.2:2.1,-1.2);
    camera.position.set(tgt.x+Math.sin(orbit.yaw)*Math.cos(orbit.pitch)*dist,tgt.y+Math.sin(orbit.pitch)*dist,tgt.z+Math.cos(orbit.yaw)*Math.cos(orbit.pitch)*dist);
    camera.lookAt(tgt);
    postMat.uniforms.time.value=time;
    renderer.setRenderTarget(rt);renderer.render(cur.scene,camera);
    renderer.setRenderTarget(null);renderer.render(postScene,postCam);}
  requestAnimationFrame(frame);}

function start(data){resize();const hid=location.hash.slice(1);select(STY[hid]?hid:(data&&STY[data.id]?data.id:'clay'),false);requestAnimationFrame(frame);}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({id:curId}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
</body>
