<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>쥐구멍에도 볕 들 날</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed 3D stage; HUD top, touch controls bottom corners, story cards centred */
:root{
  --bg:#05070c;
  --ink:#f3ede2;
  --muted:rgba(243,237,226,.74);
  --accent:#ff9a3c;
  --danger:#e2452f;
  --panel:rgba(8,10,16,.62);
  --line:rgba(243,237,226,.24);
  --display:"Gowun Batang","IBM Plex Sans KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{word-break:keep-all;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 120px 30px rgba(226,69,47,.75)}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 16px 30px;display:flex;flex-direction:column;gap:8px;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0))}
.hudrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pips{display:flex;gap:5px}
.pips i{width:16px;height:16px;border-radius:3px;background:var(--danger);transform:rotate(45deg) scale(.8);box-shadow:0 0 8px rgba(226,69,47,.6)}
.pips i.off{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.food{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.food b{color:var(--accent);font-size:20px}
#goal{font-size:13px;color:var(--muted);text-shadow:0 1px 6px #000}
#boss{display:none;flex-direction:column;gap:4px}
#boss span{font-family:var(--display);font-size:14px}
#bossbar{height:8px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:#9ad94a;transition:width .25s}
#toast{position:fixed;left:16px;right:16px;top:30%;text-align:center;font-family:var(--display);font-size:clamp(20px,5.6vw,30px);text-shadow:0 2px 14px #000;pointer-events:none;opacity:0;transition:opacity .3s;text-wrap:balance}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.05);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(243,237,226,.35)}
.pad{position:fixed;right:14px;bottom:18px;display:none;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:end}
.pad button{font:600 14px/1 var(--body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:50%;width:68px;height:68px;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pad #b-atk{width:88px;height:88px;border-color:var(--accent);font-size:16px;grid-row:span 2}
.pad button.on{background:var(--accent);color:#17110a}
.card{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(3,4,8,.55)}
.card.show{display:grid}
.card div{max-width:30em;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.card .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.card h1{font-family:var(--display);font-size:clamp(30px,8.6vw,54px);line-height:1.12;text-wrap:balance;text-shadow:0 2px 20px #000}
.card p{font-size:15px;line-height:1.7;color:var(--ink);text-shadow:0 1px 8px #000}
.card p.keys{font-size:13px;color:var(--muted)}
.card button{font:600 16px/1 var(--body);color:#17110a;background:var(--accent);border:0;border-radius:4px;padding:15px 22px;cursor:pointer}
.card .btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:14px;padding:14px 16px}
.card button:disabled{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;line-height:1.6}
@media (min-width:800px){.hud{padding:22px 28px 40px}}
/* cutscenes: letterbox, subtitles, chapter title, fade, skip */
.lb{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .9s ease}
#lbT{top:0}#lbB{bottom:0}
body.cine .lb{height:10vh}
#sub{position:fixed;left:16px;right:16px;bottom:calc(10vh + 16px);text-align:center;font-family:var(--display);font-size:clamp(17px,4.4vw,24px);line-height:1.5;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;transition:opacity .6s;pointer-events:none;text-wrap:balance}
#chap{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;pointer-events:none;opacity:0;transition:opacity 1.8s;text-shadow:0 2px 20px #000}
#chap span{font-size:13px;letter-spacing:.35em;color:var(--accent);font-weight:600}
#chap b{font-family:var(--display);font-size:clamp(36px,10vw,64px);font-weight:700}
#chap.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
#skip{position:fixed;right:14px;top:max(10px,calc(10vh - 46px));display:none;font:400 13px/1 var(--body);color:var(--ink);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer}
body.cine #skip{display:block}
@media (orientation:portrait){body.cine .lb{height:7vh}#sub{bottom:calc(7vh + 16px)}}
</style>
</head>
<body>
<canvas id="stage" aria-label="쥐 가장을 조작하는 3D 게임 화면"></canvas>
<div id="hurt"></div>
<div class="hud" id="hud" style="display:none">
  <div class="hudrow"><div class="pips" id="pips" aria-label="체력"></div><div class="food">먹이 <b id="foodn">0</b> / 5</div></div>
  <div id="goal"></div>
  <div id="boss"><span>부엌의 주인, 고양이</span><div id="bossbar"><i></i></div></div>
</div>
<div id="toast" role="status"></div>
<div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
<div id="sub" aria-live="polite"></div>
<div id="chap" aria-hidden="true"><span>제1장</span><b>첫 번째 밤</b></div>
<div id="fade"></div>
<button type="button" id="skip">건너뛰기 ›</button>
<div id="joy"><div id="knob"></div></div>
<div class="pad" id="pad">
  <button type="button" id="b-dash">구르기</button>
  <button type="button" id="b-atk">칼</button>
  <button type="button" id="b-shd">방패</button>
</div>
<div class="card show" id="intro"><div>
  <span class="eyebrow">제1장 · 첫 번째 밤</span>
  <h1>쥐구멍에도 볕 들 날</h1>
  <p>벽 속에는 식구 넷이 산다. 벽 밖에는 덫과 고양이, 그리고 거대한 발이 있다. 그래도 아버지는 매일 밤 문턱을 넘는다.</p>
  <p>먹이 다섯 개를 구해 집으로 돌아가세요. 덫은 칼로 먼저 쳐서 터뜨리면 치즈를 얻습니다. 고양이를 집까지 달고 갈 수는 없습니다.</p>
  <p class="keys" id="keys"></p>
  <span class="btns"><button type="button" id="go" disabled>캐릭터를 조형하는 중…</button><button type="button" class="ghost qbtn" aria-label="화질 바꾸기"></button><button type="button" class="ghost sbtn" aria-label="소리 켜고 끄기"></button></span>
</div></div>
<div class="card" id="end"><div>
  <span class="eyebrow" id="endeye"></span>
  <h1 id="endh"></h1>
  <p id="endp"></p>
  <span class="btns"><button type="button" id="again">다시 나서기</button><button type="button" class="ghost qbtn" aria-label="화질 바꾸기"></button><button type="button" class="ghost sbtn" aria-label="소리 켜고 끄기"></button></span>
</div></div>
<div id="err">이 기기에서 3D(WebGL)를 켤 수 없습니다. 다른 브라우저에서 다시 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T=window.THREE,canvas=document.getElementById('stage'),$=i=>document.getElementById(i);
if(!T){$('err').style.display='grid';$('intro').classList.remove('show');return;}
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}catch(e){$('err').style.display='grid';$('intro').classList.remove('show');return;}
/* a lost GPU context (tab backgrounded on a phone, driver reset) comes back blank: reload once it is restored —
   the sculpt cache makes that quick. At most twice per session so a failing GPU cannot loop. */
canvas.addEventListener('webglcontextlost',e=>e.preventDefault());
canvas.addEventListener('webglcontextrestored',()=>{let n=0;try{n=+sessionStorage.getItem('mf.reload')||0;sessionStorage.setItem('mf.reload',n+1);}catch(_){}if(n<2)location.reload();});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const touch=('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const mobile=touch||Math.min(innerWidth,innerHeight)<700;
let DPR=Math.min(window.devicePixelRatio||1,mobile?1.25:2);   /* quality.js owns this after load */
renderer.setPixelRatio(DPR);
const camera=new T.PerspectiveCamera(50,1,.25,120);
const SHELL_MAX=14;   /* fur shells built per part; the quality tier decides how many are drawn */
